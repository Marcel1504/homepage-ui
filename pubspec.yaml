name: homepage_ui
description: "Homepage of Marcel Berger"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  http: ^1.5.0
  intl: ^0.20.2
  go_router: ^16.2.4
  json_annotation: ^4.9.0
  flutter_i18n: ^0.36.3
  url_launcher: ^6.3.2
  collection: ^1.19.1
  flutter_html: ^3.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  json_serializable: ^6.11.1
  build_runner: ^2.9.0

flutter:
  uses-material-design: true
  fonts:
    - family: HpIcons
      fonts:
        - asset: assets/fonts/HpIcons.ttf
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Light.ttf
          weight: 300
        - asset: assets/fonts/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
  assets:
    - assets/images/
    - assets/i18ns/
    - assets/configs/

